---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: mariadb
spec:
  clusterIP: None   # headless - StatefulSet DNS: mariadb-0.mariadb.wordpress.svc.cluster.local
  selector:
    app.kubernetes.io/component: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: mariadb
      annotations:
        # ── Vault Agent sidecar ─────────────────────────────────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "wordpress"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-init-first: "true"

        # Render secrets as shell-sourceable env file
        vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/wordpress"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "secret/data/wordpress" -}}
          export MARIADB_ROOT_PASSWORD="{{ .Data.data.WORDPRESS_DB_ROOT_PASSWORD }}"
          export MARIADB_DATABASE="{{ .Data.data.WORDPRESS_DB_NAME }}"
          export MARIADB_USER="{{ .Data.data.WORDPRESS_DB_USER }}"
          export MARIADB_PASSWORD="{{ .Data.data.WORDPRESS_DB_PASSWORD }}"
          {{- end }}

    spec:
      serviceAccountName: mariadb
      automountServiceAccountToken: true

      # ── Security context (pod level) ───────────────────────────────────────
      securityContext:
        runAsNonRoot: false   # MariaDB needs root internally to drop to mysql user
        seccompProfile:
          type: RuntimeDefault

      # ── Init: wait for Vault secrets file to be non-empty ─────────────────
      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vault secrets..."
              until [ -s /vault/secrets/db.env ]; do
                echo "  /vault/secrets/db.env not ready yet, sleeping..."
                sleep 2
              done
              echo "Vault secrets ready."
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent

          # Source vault secrets then exec the real entrypoint
          command:
            - bash
            - -c
            - |
              set -e
              echo "Sourcing Vault secrets..."
              source /vault/secrets/db.env
              echo "Starting MariaDB..."
              exec docker-entrypoint.sh mariadbd

          # ── Security context (container level) ──────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          # ── Resource limits ──────────────────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ── Health probes ────────────────────────────────────────────────
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18   # 3 min total startup budget
            successThreshold: 1
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 10

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true

      volumes:
        - name: vault-secrets
          emptyDir:
            medium: Memory   # secrets never touch disk

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
        labels:
          app.kubernetes.io/component: mariadb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi