apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: wordpress
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: wordpress
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: wordpress
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-wordpress.env: {{ .Values.vault.secretPath }}
        vault.hashicorp.com/agent-inject-template-wordpress.env: |
          {{ "{{" }}- with secret "secret/data/wordpress" -{{ "}}" }}
          export WORDPRESS_DB_HOST="mariadb:3306"
          export WORDPRESS_DB_NAME="{{ "{{" }} .Data.data.WORDPRESS_DB_NAME {{ "}}" }}"
          export WORDPRESS_DB_USER="{{ "{{" }} .Data.data.WORDPRESS_DB_USER {{ "}}" }}"
          export WORDPRESS_DB_PASSWORD="{{ "{{" }} .Data.data.WORDPRESS_DB_PASSWORD {{ "}}" }}"
          export WORDPRESS_TABLE_PREFIX="{{ "{{" }} .Data.data.WORDPRESS_TABLE_PREFIX {{ "}}" }}"
          export WORDPRESS_AUTH_KEY="{{ "{{" }} .Data.data.WORDPRESS_AUTH_KEY {{ "}}" }}"
          export WORDPRESS_SECURE_AUTH_KEY="{{ "{{" }} .Data.data.WORDPRESS_SECURE_AUTH_KEY {{ "}}" }}"
          export WORDPRESS_LOGGED_IN_KEY="{{ "{{" }} .Data.data.WORDPRESS_LOGGED_IN_KEY {{ "}}" }}"
          export WORDPRESS_NONCE_KEY="{{ "{{" }} .Data.data.WORDPRESS_NONCE_KEY {{ "}}" }}"
          export WORDPRESS_AUTH_SALT="{{ "{{" }} .Data.data.WORDPRESS_AUTH_SALT {{ "}}" }}"
          export WORDPRESS_SECURE_AUTH_SALT="{{ "{{" }} .Data.data.WORDPRESS_SECURE_AUTH_SALT {{ "}}" }}"
          export WORDPRESS_LOGGED_IN_SALT="{{ "{{" }} .Data.data.WORDPRESS_LOGGED_IN_SALT {{ "}}" }}"
          export WORDPRESS_NONCE_SALT="{{ "{{" }} .Data.data.WORDPRESS_NONCE_SALT {{ "}}" }}"
          {{ "{{" }}- end {{ "}}" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.wordpress }}
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 33:33 /var/www/html
              chmod 755 /var/www/html
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mariadb 3306; do
                echo "Waiting for MariaDB..."
                sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          command:
            - bash
            - /etc/wordpress-config/entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID", "NET_BIND_SERVICE"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.wordpress.resources.requests.memory | quote }}
              cpu: {{ .Values.wordpress.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.wordpress.resources.limits.memory | quote }}
              cpu: {{ .Values.wordpress.resources.limits.cpu | quote }}
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: {{ .Values.wordpress.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.wordpress.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.wordpress.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.wordpress.startupProbe.failureThreshold }}
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: {{ .Values.wordpress.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.wordpress.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.wordpress.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.wordpress.readinessProbe.failureThreshold }}
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: {{ .Values.wordpress.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.wordpress.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.wordpress.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.wordpress.livenessProbe.failureThreshold }}
            successThreshold: 1
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: wordpress-config
              mountPath: /etc/wordpress-config
              readOnly: true
      volumes:
        - name: wordpress-config
          configMap:
            name: wordpress-config
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data