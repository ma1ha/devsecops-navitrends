apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: mariadb
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: mariadb
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-db.env: {{ .Values.vault.secretPath }}
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{ "{{" }}- with secret "secret/data/wordpress" -{{ "}}" }}
          export MARIADB_ROOT_PASSWORD="{{ "{{" }} .Data.data.WORDPRESS_DB_ROOT_PASSWORD {{ "}}" }}"
          export MARIADB_DATABASE="{{ "{{" }} .Data.data.WORDPRESS_DB_NAME {{ "}}" }}"
          export MARIADB_USER="{{ "{{" }} .Data.data.WORDPRESS_DB_USER {{ "}}" }}"
          export MARIADB_PASSWORD="{{ "{{" }} .Data.data.WORDPRESS_DB_PASSWORD {{ "}}" }}"
          {{ "{{" }}- end {{ "}}" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.mariadb }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -s /vault/secrets/db.env ]; do
                echo "Waiting for Vault secrets..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              source /vault/secrets/db.env
              exec docker-entrypoint.sh mariadbd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.mariadb.resources.requests.memory | quote }}
              cpu: {{ .Values.mariadb.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.mariadb.resources.limits.memory | quote }}
              cpu: {{ .Values.mariadb.resources.limits.cpu | quote }}
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: {{ .Values.mariadb.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mariadb.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mariadb.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mariadb.startupProbe.failureThreshold }}
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: {{ .Values.mariadb.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mariadb.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mariadb.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mariadb.readinessProbe.failureThreshold }}
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/db.env
                  mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
            initialDelaySeconds: {{ .Values.mariadb.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mariadb.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mariadb.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mariadb.livenessProbe.failureThreshold }}
            successThreshold: 1
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
        labels:
          app.kubernetes.io/component: mariadb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mariadb.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: mariadb
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
