namespace: nextcloud

serviceAccount:
  name: nextcloud

vault:
  role: nextcloud
  secretPath: secret/data/next_cloud
  secretFile: config

nextcloud:
  image:
    repository: nextcloud
    tag: "33-apache"
    pullPolicy: IfNotPresent
  replicas: 1
  trustedDomains: "localhost nextcloud.navitrends-maha.duckdns.org"
  resources:
    requests:
      memory: "512Mi"
      cpu: "10m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    size: 5Gi
    storageClass: local-path
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

postgres:
  image:
    repository: postgres
    tag: "15.10"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "10m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    size: 5Gi
    storageClass: local-path
  securityContext:
    fsGroup: 999
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
# Network Policies
networkPolicy:
  enabled: true
