apiVersion: v1
kind: Service
metadata:
  name: frappe-db
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: db
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frappe-db
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: db
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: frappe-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: db
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: {{ .Values.vault.secretPath }}
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{ "{{" }}- with secret "secret/data/frappe" -{{ "}}" }}
          export MYSQL_ROOT_PASSWORD="{{ "{{" }} .Data.data.FRAPPE_MYSQL_ROOT_PASSWORD {{ "}}" }}"
          export MYSQL_ROOT_HOST="%"
          {{ "{{" }}- end {{ "}}" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -s /vault/secrets/frappe.env ]; do
                echo "Waiting for Vault secrets..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              source /vault/secrets/frappe.env
              exec docker-entrypoint.sh mariadbd \
                --character-set-server=utf8mb4 \
                --collation-server=utf8mb4_unicode_ci \
                --skip-character-set-client-handshake \
                --skip-innodb-read-only-compressed \
                --max_allowed_packet=256M \
                --innodb_buffer_pool_size=512M
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              memory: {{ .Values.mariadb.resources.requests.memory | quote }}
              cpu: {{ .Values.mariadb.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.mariadb.resources.limits.memory | quote }}
              cpu: {{ .Values.mariadb.resources.limits.cpu | quote }}
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: frappe-db-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: frappe-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mariadb.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}