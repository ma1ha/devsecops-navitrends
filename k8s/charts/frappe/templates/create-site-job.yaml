apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-create-site
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: create-site
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: create-site
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: {{ .Values.vault.secretPath }}
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{ "{{" }}- with secret "secret/data/frappe" -{{ "}}" }}
          export FRAPPE_MYSQL_ROOT_PASSWORD="{{ "{{" }} .Data.data.FRAPPE_MYSQL_ROOT_PASSWORD {{ "}}" }}"
          export FRAPPE_ADMIN_PASSWORD="{{ "{{" }} .Data.data.FRAPPE_ADMIN_PASSWORD {{ "}}" }}"
          export FRAPPE_ENCRYPTION_KEY="{{ "{{" }} .Data.data.FRAPPE_ENCRYPTION_KEY {{ "}}" }}"
          {{ "{{" }}- end {{ "}}" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -s /vault/secrets/frappe.env ]; do
                echo "Waiting for Vault secrets..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z frappe-db 3306; do
                echo "Waiting for MariaDB..."
                sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z frappe-redis-cache 6379 && nc -z frappe-redis-queue 6379; do
                echo "Waiting for Redis..."
                sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: create-site
          image: {{ .Values.frappe.image.repository }}:{{ .Values.frappe.image.tag }}
          imagePullPolicy: {{ .Values.frappe.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              source /vault/secrets/frappe.env
              if [ -f /home/frappe/frappe-bench/sites/.site-initialized ]; then
                echo "=== Already initialized - skipping ==="
                exit 0
              fi
              echo "=== [1/6] Writing common_site_config.json ==="
              mkdir -p /home/frappe/frappe-bench/sites
              cp /etc/frappe-config/common_site_config.json \
                 /home/frappe/frappe-bench/sites/common_site_config.json
              if [ ! -f /home/frappe/frappe-bench/sites/apps.txt ]; then
                printf "frappe\nerpnext\n" > /home/frappe/frappe-bench/sites/apps.txt
              fi
              echo "=== [2/6] Waiting for MariaDB to accept connections ==="
              for i in $(seq 1 30); do
                mysql -h frappe-db -u root -p"$FRAPPE_MYSQL_ROOT_PASSWORD" \
                  -e "SELECT 1" >/dev/null 2>&1 && break
                echo "Attempt $i/30..."
                sleep 5
              done
              echo "=== [3/6] Creating site ==="
              SITE_NAME={{ .Values.frappe.siteName }}
              if [ ! -d /home/frappe/frappe-bench/sites/$SITE_NAME ]; then
                bench new-site $SITE_NAME \
                  --db-host frappe-db \
                  --db-root-password "$FRAPPE_MYSQL_ROOT_PASSWORD" \
                  --admin-password "$FRAPPE_ADMIN_PASSWORD" \
                  --install-app erpnext \
                  --set-default \
                  --mariadb-user-host-login-scope="%"
              else
                echo "Site $SITE_NAME already exists, skipping."
              fi
              echo "=== [4/6] Setting encryption key ==="
              bench --site $SITE_NAME set-config encryption_key "$FRAPPE_ENCRYPTION_KEY"
              echo "=== [5/6] Running migrations ==="
              bench --site $SITE_NAME migrate
              echo "=== [6/6] Enabling scheduler ==="
              bench --site $SITE_NAME enable-scheduler
              touch /home/frappe/frappe-bench/sites/.site-initialized
              echo "=== DONE ==="
          env:
            - name: FRAPPE_SITE_NAME
              value: {{ .Values.frappe.siteName }}
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: frappe-logs
              mountPath: /home/frappe/frappe-bench/logs
            - name: frappe-config
              mountPath: /etc/frappe-config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
      volumes:
        - name: frappe-sites
          persistentVolumeClaim:
            claimName: frappe-sites
        - name: frappe-logs
          persistentVolumeClaim:
            claimName: frappe-logs
        - name: frappe-config
          configMap:
            name: frappe-config