apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-worker-default
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: worker-default
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: worker-default
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role }}
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: {{ .Values.vault.secretPath }}
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{ "{{" }}- with secret "secret/data/frappe" -{{ "}}" }}
          export FRAPPE_ENCRYPTION_KEY="{{ "{{" }} .Data.data.FRAPPE_ENCRYPTION_KEY {{ "}}" }}"
          {{ "{{" }}- end {{ "}}" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-site
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -f /home/frappe/frappe-bench/sites/.site-initialized ]; do
                echo "Waiting for site initialization..."
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
      containers:
        - name: worker
          image: {{ .Values.frappe.image.repository }}:{{ .Values.frappe.image.tag }}
          imagePullPolicy: {{ .Values.frappe.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              source /vault/secrets/frappe.env
              exec bench worker --queue default
          env:
            - name: DB_HOST
              value: frappe-db
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: redis://frappe-redis-cache:6379
            - name: REDIS_QUEUE
              value: redis://frappe-redis-queue:6379
            - name: REDIS_SOCKETIO
              value: redis://frappe-redis-queue:6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          resources:
            requests:
              memory: {{ .Values.worker.resources.requests.memory | quote }}
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.worker.resources.limits.memory | quote }}
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: frappe-logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: frappe-sites
          persistentVolumeClaim:
            claimName: frappe-sites
        - name: frappe-logs
          persistentVolumeClaim:
            claimName: frappe-logs
---
