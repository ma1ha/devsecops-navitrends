namespace: frappe

serviceAccount:
  name: frappe

vault:
  role: frappe
  secretPath: secret/data/frappe
  secretFile: frappe.env

frappe:
  image:
    repository: frappe/erpnext
    tag: "v15"
    pullPolicy: IfNotPresent
  siteName: erpnext.localhost

mariadb:
  image:
    repository: mariadb
    tag: "10.6"
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  cache:
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "320Mi"
        cpu: "200m"
  queue:
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

gunicorn:
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

scheduler:
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "300m"

socketio:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

worker:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

persistence:
  sites:
    size: 10Gi
    storageClass: local-path
  logs:
    size: 2Gi
    storageClass: local-path