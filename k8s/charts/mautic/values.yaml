
namespace: mautic


serviceAccount:
  name: mautic

vault:
  role: mautic
  secretPath: secret/data/mautic
  secretFile: config

mautic:
  replicas: 1

  image:
    repository: mautic/mautic
    tag: "5-apache"
    pullPolicy: IfNotPresent

  siteUrl: "https://maha.nav.ovh/mautic"

  db:
    host: mautic-mariadb
    port: "3306"

  mailer:
    fromName: "Mautic"
    fromEmail: "noreply@navitrends.com"
    transport: mail
    spoolType: memory

  php:
    memoryLimit: "512M"
    maxExecutionTime: "300"

  resources:
    requests:
      memory: "512Mi"
      cpu: "10m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  livenessProbe:
    path: /s/login
    port: 80
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10

  persistence:
    config:
      size: 1Gi
    logs:
      size: 1Gi
    media:
      size: 2Gi

mariadb:
  image:
    repository: mariadb
    tag: "10.11"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "256Mi"
      cpu: "10m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    size: 5Gi
    storageClass: local-path

  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

networkPolicy:
  enabled: true
