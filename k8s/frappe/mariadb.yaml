---
apiVersion: v1
kind: Service
metadata:
  name: frappe-db
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frappe-db
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: db
spec:
  serviceName: frappe-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: db
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "frappe"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: "secret/data/frappe"
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{- with secret "secret/data/frappe" -}}
          export MYSQL_ROOT_PASSWORD="{{ .Data.data.FRAPPE_MYSQL_ROOT_PASSWORD }}"
          export MYSQL_ROOT_HOST="%"
          {{- end }}
    spec:
      serviceAccountName: frappe
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -s /vault/secrets/frappe.env ]; do
                echo "Waiting for Vault secrets..."
                sleep 2
              done
              echo "Vault secrets ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: mariadb
          image: mariadb:10.6
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -e
              source /vault/secrets/frappe.env
              exec docker-entrypoint.sh mariadbd \
                --character-set-server=utf8mb4 \
                --collation-server=utf8mb4_unicode_ci \
                --skip-character-set-client-handshake \
                --skip-innodb-read-only-compressed \
                --max_allowed_packet=256M \
                --innodb_buffer_pool_size=512M

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault

          ports:
            - name: mysql
              containerPort: 3306

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  source /vault/secrets/frappe.env
                  mariadb-admin ping -u root -p"${MYSQL_ROOT_PASSWORD}" --silent
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10

          volumeMounts:
            - name: frappe-db-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: frappe-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi