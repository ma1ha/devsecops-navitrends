---
apiVersion: v1
kind: Service
metadata:
  name: frappe-gunicorn
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: gunicorn
spec:
  selector:
    app.kubernetes.io/component: gunicorn
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-gunicorn
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: gunicorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gunicorn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: gunicorn
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "frappe"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: "secret/data/frappe"
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{- with secret "secret/data/frappe" -}}
          export FRAPPE_MYSQL_ROOT_PASSWORD="{{ .Data.data.FRAPPE_MYSQL_ROOT_PASSWORD }}"
          export FRAPPE_ENCRYPTION_KEY="{{ .Data.data.FRAPPE_ENCRYPTION_KEY }}"
          {{- end }}
    spec:
      serviceAccountName: frappe
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-site
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -f /home/frappe/frappe-bench/sites/.site-initialized ]; do
                echo "Waiting for site initialization..."
                sleep 5
              done
              echo "Site ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true

      containers:
        - name: gunicorn
          image: frappe/erpnext:v15
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              source /vault/secrets/frappe.env
              exec bench serve --port 8000

          env:
            - name: DB_HOST
              value: frappe-db
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: redis://frappe-redis-cache:6379
            - name: REDIS_QUEUE
              value: redis://frappe-redis-queue:6379
            - name: REDIS_SOCKETIO
              value: redis://frappe-redis-queue:6379

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10

          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: frappe-logs
              mountPath: /home/frappe/frappe-bench/logs

      volumes:
        - name: frappe-sites
          persistentVolumeClaim:
            claimName: frappe-sites
        - name: frappe-logs
          persistentVolumeClaim:
            claimName: frappe-logs