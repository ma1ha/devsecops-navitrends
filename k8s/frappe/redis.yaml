---
apiVersion: v1
kind: Service
metadata:
  name: frappe-redis-cache
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-cache
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: redis-cache
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-redis-cache
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: redis-cache
    spec:
      serviceAccountName: frappe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 320Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: redis-cache-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: redis-cache-data
          persistentVolumeClaim:
            claimName: frappe-redis-cache-data
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-redis-cache-data
  namespace: frappe
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: frappe-redis-queue
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-queue
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: redis-queue
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-redis-queue
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: redis-queue
    spec:
      serviceAccountName: frappe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: redis-queue-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: redis-queue-data
          persistentVolumeClaim:
            claimName: frappe-redis-queue-data
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-redis-queue-data
  namespace: frappe
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi