---
# ── Scheduler ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-scheduler
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: scheduler
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "frappe"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-frappe.env: "secret/data/frappe"
        vault.hashicorp.com/agent-inject-template-frappe.env: |
          {{- with secret "secret/data/frappe" -}}
          export FRAPPE_ENCRYPTION_KEY="{{ .Data.data.FRAPPE_ENCRYPTION_KEY }}"
          {{- end }}
    spec:
      serviceAccountName: frappe
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-site
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -f /home/frappe/frappe-bench/sites/.site-initialized ]; do
                echo "Waiting for site initialization..."
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true

      containers:
        - name: scheduler
          image: frappe/erpnext:v15
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              source /vault/secrets/frappe.env
              exec bench schedule
          env:
            - name: DB_HOST
              value: frappe-db
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: redis://frappe-redis-cache:6379
            - name: REDIS_QUEUE
              value: redis://frappe-redis-queue:6379
            - name: REDIS_SOCKETIO
              value: redis://frappe-redis-queue:6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: frappe-logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: frappe-sites
          persistentVolumeClaim:
            claimName: frappe-sites
        - name: frappe-logs
          persistentVolumeClaim:
            claimName: frappe-logs

---
# ── Socketio ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frappe-realtime
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: socketio
spec:
  selector:
    app.kubernetes.io/component: socketio
  ports:
    - name: socketio
      port: 9000
      targetPort: 9000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-socketio
  namespace: frappe
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: socketio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: socketio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: socketio
    spec:
      serviceAccountName: frappe
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-site
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -f /home/frappe/frappe-bench/sites/.site-initialized ]; do
                echo "Waiting for site initialization..."
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true

      containers:
        - name: socketio
          image: frappe/erpnext:v15
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/realtime/index.js
          env:
            - name: REDIS_CACHE
              value: redis://frappe-redis-cache:6379
            - name: REDIS_QUEUE
              value: redis://frappe-redis-queue:6379
            - name: REDIS_SOCKETIO
              value: redis://frappe-redis-queue:6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: frappe-sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
      volumes:
        - name: frappe-sites
          persistentVolumeClaim:
            claimName: frappe-sites