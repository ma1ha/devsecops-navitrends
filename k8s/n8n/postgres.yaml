---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  serviceName: n8n-postgres
  replicas: 1
  selector:
    matchLabels:
      app: n8n-postgres
  
  template:
    metadata:
      labels:
        app: n8n-postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "n8n"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/n8n"
        vault.hashicorp.com/agent-inject-file-config: "config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/n8n" -}}
          export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          {{- end }}
    
    spec:
      serviceAccountName: n8n
      terminationGracePeriodSeconds: 30
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      
      containers:
        - name: postgres
          image: postgres:15.10
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/bash
            - -c
            - |
              # Wait for Vault Agent to inject secrets
              until [ -f /vault/secrets/config ]; do
                echo "Waiting for Vault Agent..."
                sleep 2
              done
              
              # Source the secrets
              source /vault/secrets/config
              
              # Start PostgreSQL
              exec docker-entrypoint.sh postgres
          
          ports:
            - containerPort: 5432
              name: postgres
          
          startupProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
              - ALL
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
        storageClassName: local-path

---
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres
  namespace: n8n
  labels:
    app: n8n-postgres
spec:
  clusterIP: None
  selector:
    app: n8n-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres