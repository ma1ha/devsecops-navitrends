---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  
  template:
    metadata:
      labels:
        app: n8n
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "n8n"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/n8n"
        vault.hashicorp.com/agent-inject-file-config: "config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/n8n" -}}
          export DB_POSTGRESDB_DATABASE="{{ .Data.data.POSTGRES_DB }}"
          export DB_POSTGRESDB_USER="{{ .Data.data.POSTGRES_USER }}"
          export DB_POSTGRESDB_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          export N8N_ENCRYPTION_KEY="{{ .Data.data.ENCRYPTION_KEY }}"
          export N8N_USER_MANAGEMENT_JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          {{- end }}
    
    spec:
      restartPolicy: Always
      serviceAccountName: n8n
      terminationGracePeriodSeconds: 30
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: n8n
          image: n8nio/n8n:2.11.4
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/sh
            - -c
            - |
              # Wait for Vault Agent to inject secrets
              until [ -f /vault/secrets/config ]; do
                echo "Waiting for Vault Agent to inject secrets..."
                sleep 2
              done
              
              # Source the secrets as environment variables
              source /vault/secrets/config
              
              # Start n8n
              exec n8n start
          
          env:
            - name: N8N_PROTOCOL
              value: "http"
            - name: N8N_HOST
              value: "n8n.maha.nav.ovh"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_WEBHOOK_URL
              value: "https://n8n.maha.nav.ovh/"
            - name: WEBHOOK_URL
              value: "https://n8n.maha.nav.ovh/"
            - name: GENERIC_TIMEZONE
              value: "Europe/Paris"
            - name: N8N_METRICS
              value: "true"
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "false"
            - name: N8N_SECURE_COOKIE
              value: "true"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_PAYLOAD_SIZE_MAX
              value: "10485760"
            - name: N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN
              value: "true"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "n8n-postgres"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "168"
          
          ports:
            - containerPort: 5678
              name: http
          
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
              - ALL
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  selector:
    app: n8n
  type: ClusterIP
  ports:
    - port: 5678
      targetPort: 5678
      name: http