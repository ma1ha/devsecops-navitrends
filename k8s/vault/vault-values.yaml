injector:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

server:
  enabled: true
  image:
    repository: hashicorp/vault
    tag: "1.21.2"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add:
        - IPC_LOCK
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "raft" {
        path = "/vault/data"
        node_id = "vault-0"
      }

      api_addr = "http://vault.vault.svc.cluster.local:8200"
      cluster_addr = "https://vault.vault.svc.cluster.local:8201"
      disable_mlock = true

  dataStorage:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce

  serviceAccount:
    create: true
    name: vault

  service:
    enabled: true
    type: ClusterIP
    port: 8200

ui:
  enabled: true
  serviceType: ClusterIP
