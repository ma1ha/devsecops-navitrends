apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unsealer
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-unsealer
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-unsealer
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault-unsealer
    namespace: vault
roleRef:
  kind: Role
  name: vault-unsealer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: vault
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-unsealer
          restartPolicy: OnFailure
          containers:
            - name: unsealer
              image: hashicorp/vault:1.21.2
              command:
                - /bin/sh
                - -c
                - |
                  VAULT_ADDR="http://vault.vault.svc:8200"
                  SEALED=$(vault status -address=$VAULT_ADDR 2>/dev/null | grep "Sealed" | awk '{print $2}')
                  if [ "$SEALED" = "true" ]; then
                    echo "Vault is sealed, unsealing..."
                    vault operator unseal -address=$VAULT_ADDR $KEY1
                    vault operator unseal -address=$VAULT_ADDR $KEY2
                    vault operator unseal -address=$VAULT_ADDR $KEY3
                    echo "Vault unsealed!"
                  else
                    echo "Vault is already unsealed, nothing to do."
                  fi
              env:
                - name: KEY1
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key1
                - name: KEY2
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key2
                - name: KEY3
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key3
