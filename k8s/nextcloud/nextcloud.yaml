apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  
  template:
    metadata:
      labels:
        app: nextcloud
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "nextcloud"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/next_cloud"
        vault.hashicorp.com/agent-inject-file-config: "config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/next_cloud" -}}
          export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          {{- end }}
    
    spec:
      restartPolicy: Always
      serviceAccountName: nextcloud
      terminationGracePeriodSeconds: 30
      
      containers:
        - name: nextcloud
          image: nextcloud:33-apache
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/bash
            - -c
            - |
              until [ -f /vault/secrets/config ]; do
                echo "Waiting for Vault Agent..."
                sleep 2
              done
              
              source /vault/secrets/config
              export POSTGRES_HOST=nextcloud-postgres
              export NEXTCLOUD_TRUSTED_DOMAINS="localhost nextcloud.maha.nav.ovh"
              exec /entrypoint.sh apache2-foreground
          
          ports:
            - containerPort: 80
              name: http
          
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          
          securityContext:
            allowPrivilegeEscalation: false
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
      
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data