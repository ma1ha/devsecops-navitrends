apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maha-nav-ovh
  namespace: traefik
spec:
  secretName: maha-nav-ovh-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: maha.nav.ovh
  dnsNames:
    - maha.nav.ovh
