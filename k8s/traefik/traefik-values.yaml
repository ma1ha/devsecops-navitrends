logs:
  general:
    level: INFO
  access:
    enabled: true

hostNetwork: true

service:
  type: ClusterIP

ports:
  web:
    port: 80
  websecure:
    port: 443

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.3.5"

deployment:
  replicas: 1

updateStrategy:
  type: Recreate

volumes:
  - name: crowdsec-bouncer-secret
    secretName: crowdsec-bouncer-secret
    mountPath: "/etc/crowdsec"
    type: secret

additionalArguments:
  - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,127.0.0.1/32,172.16.0.0/12"
