apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: odoo-postgres
  namespace: odoo
spec:
  serviceName: odoo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: odoo-postgres
  template:
    metadata:
      labels:
        app: odoo-postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "odoo"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/odoo"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/odoo" -}}
          export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          {{- end }}
    spec:
      serviceAccountName: odoo
      containers:
        - name: postgres
          image: postgres:15.10
          command:
            - /bin/bash
            - -c
            - |
              source /vault/secrets/config
              exec docker-entrypoint.sh postgres
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - odoo_prod
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-postgres
  namespace: odoo
spec:
  selector:
    app: odoo-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None