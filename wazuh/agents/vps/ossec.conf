<ossec_config>

  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>127.0.0.1</manager_address>
      <port>1515</port>
      <agent_name>vps-navitrends</agent_name>
    </enrollment>
    <auto_restart>yes</auto_restart>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Project directory: unauthorized code changes = supply chain risk -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/maha/devsecops-navitrends</directories>

    <!-- System binaries: rootkit/backdoor installation leaves traces here -->
    <directories check_all="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <!-- Shared libs: LD_PRELOAD hijacks target these -->
    <directories check_all="yes" realtime="yes">/lib,/lib64,/usr/lib</directories>

    <!-- Auth and sudo: privilege escalation starts here -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/sudoers.d,/etc/pam.d</directories>
    <file check_all="yes" realtime="yes">/etc/sudoers</file>
    <file check_all="yes" realtime="yes">/etc/passwd</file>
    <file check_all="yes" realtime="yes">/etc/shadow</file>
    <file check_all="yes" realtime="yes">/etc/group</file>

    <!-- SSH: key rotation or config changes are high-severity -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/ssh</directories>
    <directories check_all="yes" realtime="yes">/home/maha/.ssh</directories>
    <file check_all="yes" realtime="yes">/root/.ssh/authorized_keys</file>

    <!-- Cron: attacker persistence mechanism #1 on Linux -->
    <directories check_all="yes" realtime="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly</directories>
    <file check_all="yes" realtime="yes">/etc/crontab</file>

    <!-- Systemd units: attacker persistence mechanism #2 -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>

    <!-- Docker daemon config: detect runtime flag tampering -->
    <file check_all="yes" realtime="yes">/etc/docker/daemon.json</file>

    <!-- Wazuh agent self-integrity -->
    <directories check_all="yes" realtime="yes">/var/ossec/etc</directories>

    <!-- Ignore high-churn paths with no security value -->
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
    <ignore>/dev</ignore>
    <ignore>/run</ignore>
    <ignore>/home/maha/devsecops-navitrends/trivy-reports</ignore>
    <ignore>/home/maha/devsecops-navitrends/dclint-reports</ignore>
    <ignore>/home/maha/devsecops-navitrends/.git</ignore>
    <ignore type="sregex">\.log$</ignore>
    <ignore type="sregex">\.tmp$</ignore>
    <ignore type="sregex">\.pyc$</ignore>
    <ignore type="sregex">__pycache__</ignore>
  </syscheck>

  <!-- SSH brute force, sudo, PAM failures -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Kernel: OOM kills, interface changes -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <!-- General syslog: cron execution, daemon events -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- dpkg/apt: detect unauthorized package installs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- ALL Docker container logs via wildcard - automatically picks up any container -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
    <label key="service">container-stdout</label>
  </localfile>

  <!-- Docker listener: container lifecycle events -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

  <!-- SCA: disabled policy spec since Ubuntu 24.04 policy not available in 4.7.5 -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Rootcheck: scan for rootkits and trojans -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <!-- Syscollector: full inventory every hour -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <labels>
    <label key="host">ecs-9da9</label>
    <label key="ip">164.160.1.137</label>
    <label key="env">production</label>
    <label key="project">devsecops-navitrends</label>
    <label key="role">vps-container-host</label>
    <label key="os">ubuntu24</label>
    <label key="stack">docker</label>
  </labels>

</ossec_config>