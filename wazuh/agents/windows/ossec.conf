<!--
  WAZUH AGENT — WINDOWS JENKINS BUILD SERVER
  Project: devsecops-navitrends
  Role: CI/CD pipeline runner, Jenkins controller
  OS: Windows 11
  Tuning philosophy: Deep visibility on CI/CD attack surface.
  Every event channel is justified; scheduled scans offset to avoid
  overlap with Jenkins build windows (typically 09:00–17:00).
-->
<ossec_config>

  <!-- ============================================================
       MANAGER CONNECTION
       Same SSH tunnel strategy as VPS agent.
  ============================================================ -->
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>127.0.0.1</manager_address>
      <port>1515</port>
      <agent_name>windows-jenkins</agent_name>
    </enrollment>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ============================================================
       FILE INTEGRITY MONITORING (FIM)
       Windows-specific: realtime uses ReadDirectoryChangesW.
       report_changes on secrets/jobs to get diff-level visibility
       when credential files or pipeline scripts change.
  ============================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- ── Jenkins pipeline definitions & job configs ──
         Jenkinsfile changes here = someone modified your CI/CD pipeline.
         This is a critical supply-chain attack vector. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\ProgramData\Jenkins\.jenkins\jobs</directories>

    <!-- ── Jenkins secrets ──
         Encrypted credentials live here. File-level change = credential rotation
         OR exfiltration attempt. Alert immediately. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\ProgramData\Jenkins\.jenkins\secrets</directories>

    <!-- ── Jenkins user accounts ──
         New user = unauthorized access. Modified user = privilege change. -->
    <directories check_all="yes" realtime="yes">C:\ProgramData\Jenkins\.jenkins\users</directories>

    <!-- ── Jenkins plugins ──
         Malicious plugin installs are a known Jenkins attack vector (CVE-2023-27898).
         New .jpi/.hpi file = verify immediately. -->
    <directories check_all="yes" realtime="yes">C:\ProgramData\Jenkins\.jenkins\plugins</directories>

    <!-- ── Jenkins config.xml ──
         Global security config lives here. realtime catches real-time tampering. -->
    <file check_all="yes" realtime="yes">C:\ProgramData\Jenkins\.jenkins\config.xml</file>

    <!-- ── Jenkins binary install ──
         Tampered WAR file = code execution on every build. -->
    <directories check_all="yes" realtime="yes">C:\Program Files\Jenkins</directories>

    <!-- ── SSH keys ──
         Used by Jenkins to clone repos and deploy. Replacement = MitM on pipelines. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Users\Maha\.ssh</directories>

    <!-- ── Windows hosts file ──
         DNS hijacking first step: modify hosts file to redirect git/registry domains. -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>

    <!-- ── Startup persistence locations ──
         Classic attacker persistence: drop executable in startup folder. -->
    <directories check_all="yes" realtime="yes">C:\Users\Maha\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>

    <!-- ── Scheduled tasks on disk ──
         Attackers create tasks here for persistent execution.
         Complement with TaskScheduler event channel below. -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>

    <!-- ── Windows system binaries ──
         LOLBins: attackers replace or trojan system tools (certutil, bitsadmin, etc.). -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32</directories>

    <!-- ── Wazuh agent self-integrity ──
         If the agent config is tampered, you lose visibility. Detect it. -->
    <directories check_all="yes" realtime="yes">C:\Program Files (x86)\ossec-agent\etc</directories>

    <!-- ── Ignore high-churn build artifacts — zero security signal ── -->
    <ignore>C:\ProgramData\Jenkins\.jenkins\workspace</ignore>
    <ignore>C:\ProgramData\Jenkins\.jenkins\builds</ignore>
    <ignore>C:\ProgramData\Jenkins\.jenkins\caches</ignore>
    <ignore>C:\ProgramData\Jenkins\.jenkins\logs</ignore>
    <ignore type="sregex">\.tmp$</ignore>
    <ignore type="sregex">\.log$</ignore>
    <ignore type="sregex">\.class$</ignore>
    <ignore type="sregex">\.jar\.bak$</ignore>
  </syscheck>

  <!-- ============================================================
       WINDOWS EVENT LOG COLLECTION
       Standard channels (Application/Security/System) use eventlog
       format. Modern channels use eventchannel (XML-structured).
       Security note: most high-value events are in Security channel —
       ensure audit policy is enabled (auditpol /get /category:*).
  ============================================================ -->

  <!-- Software crashes, Jenkins JVM errors, MSI installs -->
  <localfile>
    <log_format>eventlog</log_format>
    <location>Application</location>
  </localfile>

  <!-- ── SECURITY CHANNEL — Most critical ──
       Event IDs you care about most:
         4624/4625: logon success/failure          4648: explicit credential use
         4688: process creation (needs audit policy) 4698/4702: scheduled task created/modified
         4720/4726: user account created/deleted    4732/4733: group membership change
         4771: Kerberos pre-auth failure            4776: NTLM auth attempt
         4946/4950: firewall rule change -->
  <localfile>
    <log_format>eventlog</log_format>
    <location>Security</location>
  </localfile>

  <!-- Service installs, driver loads, BSODs, time sync -->
  <localfile>
    <log_format>eventlog</log_format>
    <location>System</location>
  </localfile>

  <!-- ============================================================
       POWERSHELL LOGGING
       PowerShell is the #1 post-exploitation tool on Windows.
       Script block logging captures full decoded scripts — catches
       obfuscation. Operational logs capture invocation metadata.
       PREREQUISITE: Enable via GPO or registry:
         HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
         EnableScriptBlockLogging = 1
  ============================================================ -->

  <!-- Script block logging: full script content, decoded strings, obfuscated payloads -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <!-- Module logging & legacy PS events -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Windows PowerShell</location>
  </localfile>

  <!-- ============================================================
       SYSMON — PROCESS & NETWORK TELEMETRY
       Sysmon event IDs monitored:
         1: Process creation (full command line, parent, hashes)
         3: Network connections (source/dest IP, port, process)
         7: Image/DLL loaded (detect DLL hijacking)
         8: Remote thread creation (process injection)
         10: Process access (credential dumping via LSASS)
         11: File created (dropper activity)
         12/13: Registry key create/modify (persistence)
         22: DNS query (C2 beaconing detection)
       PREREQUISITE: Install Sysmon + SwiftOnSecurity config or custom config.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- ============================================================
       TASK SCHEDULER
       Event IDs: 106 (task registered), 200 (task launched),
       201 (task completed), 141 (task deleted).
       Correlate with Security 4698 for full picture.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
  </localfile>

  <!-- ============================================================
       WINDOWS DEFENDER
       Event IDs: 1116 (malware detected), 1117 (remediation action),
       1006 (engine update), 5001 (real-time protection disabled ← CRITICAL).
       "Protection disabled" alert should page on-call immediately.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
  </localfile>

  <!-- ============================================================
       WINDOWS FIREWALL
       Blocked inbound/outbound connections. Noisy but valuable for:
       - Detecting lateral movement attempts
       - Identifying unexpected outbound C2 traffic from Jenkins
       - Port scans hitting the host
       NOTE: If volume is too high, filter on manager side with
       rule max_size or group-based filtering. Don't disable here.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
  </localfile>

  <!-- ============================================================
       WMI OPERATIONAL — WMI-BASED ATTACKS
       WMI subscriptions are a fileless persistence mechanism.
       Event ID 5861: permanent subscription registered (HIGH SEVERITY).
       Low volume, high signal — always collect this.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-WMI-Activity/Operational</location>
  </localfile>

  <!-- ============================================================
       DNS CLIENT — C2 DETECTION
       Every DNS query the host makes is logged here.
       Detect: DGA domains, unusual TLDs, high-frequency beaconing.
       Event ID 3008: DNS query response.
       PREREQUISITE: Enable via GPO or:
         reg add "HKLM\SYSTEM\CurrentControlSet\Services\DNS\Parameters" /v EnableDnsLogging /t REG_DWORD /d 1
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-DNS-Client/Operational</location>
  </localfile>

  <!-- ============================================================
       BITS CLIENT — DOWNLOAD MANAGER ABUSE
       Attackers use BITS to download payloads stealthily.
       Event ID 59: BITS job created. Low volume, high value.
  ============================================================ -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Bits-Client/Operational</location>
  </localfile>

  <!-- ============================================================
       JENKINS APPLICATION LOGS
       health-checker.log captures: plugin failures, memory warnings,
       connectivity issues. Add Jenkins audit trail log if plugin installed.
       NOTE: Install "Audit Trail" Jenkins plugin for API-level audit logging.
             Point it to: C:\ProgramData\Jenkins\.jenkins\logs\audit.log
  ============================================================ -->
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\ProgramData\Jenkins\.jenkins\logs\health-checker.log</location>
    <label key="service">jenkins-health</label>
  </localfile>

  <!-- Jenkins Audit Trail plugin log — records who triggered what build, API calls, config changes -->
  <!-- Uncomment after installing the Audit Trail plugin -->
  <!--
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\ProgramData\Jenkins\.jenkins\logs\audit.log</location>
    <label key="service">jenkins-audit</label>
  </localfile>
  -->

  <!-- ============================================================
       SECURITY CONFIGURATION ASSESSMENT (SCA)
       CIS Windows 11 Enterprise benchmark — 200+ checks.
       Covers: account policy, audit policy, service config,
       Windows Defender settings, UAC, SMB signing, etc.
       Runs at 00:00 and 12:00 — offset from build hours.
  ============================================================ -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <policies>
      <policy>ruleset/sca/cis_win11_enterprise.yml</policy>
    </policies>
  </sca>

  <!-- ============================================================
       SYSCOLLECTOR
       Feeds Vulnerability Detector: compares installed packages and
       hotfixes against NVD CVE database. Catch unpatched Jenkins,
       Java JDK, Git, or OS vulnerabilities automatically.
       hotfixes: yes — critical for Windows patch compliance visibility.
  ============================================================ -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>   <!-- Catch Jenkins/Java listeners + any unexpected open ports -->
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>       <!-- Windows patch level — feeds CVE correlation on manager -->
  </wodle>

  <!-- ============================================================
       LABELS
       Use in Wazuh dashboard KQL: agent.labels.role:"jenkins-build-server"
       Filter pipeline-related alerts from general Windows noise.
  ============================================================ -->
  <labels>
    <label key="host">windows-jenkins</label>
    <label key="env">production</label>
    <label key="project">devsecops-navitrends</label>
    <label key="role">jenkins-build-server</label>
    <label key="os">windows11</label>
    <label key="stack">jenkins,java,git</label>
  </labels>

</ossec_config>