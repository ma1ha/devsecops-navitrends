limit_req_zone $binary_remote_addr zone=wp_login:10m rate=1r/s;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    resolver 127.0.0.11 valid=30s;   # ← Docker's internal DNS

    server_tokens off;

    add_header X-Frame-Options        "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options "nosniff"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location ~* /\.(git|env|htaccess|htpasswd)$ { deny all; }
    location ~* wp-config\.php                  { deny all; }
    location ~* /wp-admin/includes/             { deny all; }
    location ~* /wp-includes/[^/]+\.php$        { deny all; }
    location = /xmlrpc.php                      { deny all; }
    location = /wp-cron.php                     { deny all; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        set $upstream wordpress:9000;   # ← variable = dynamic DNS resolution
        fastcgi_pass        $upstream;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param       HTTP_PROXY "";
        include             fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        set $upstream wordpress:9000;   # ← same here
        fastcgi_pass        $upstream;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param       HTTP_PROXY "";
        include             fastcgi_params;
    }
}